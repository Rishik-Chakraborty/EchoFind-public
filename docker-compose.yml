version: '3.9'
services:
  db:
    image: ankane/pgvector:latest
    container_name: echofind-db
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    # Postgres is only accessible from other containers, not the host
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: echofind-backend
    env_file:
      - .env
    ports:
      - "8000:7860"
    depends_on:
      - db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: echofind-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  pgdata:
